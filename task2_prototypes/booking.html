<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сладкие сны — Бронирование номера</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Сладкие сны</a>
    <nav class="main-nav">
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
    </nav>
  </div>
  <div class="slogan">Сладкие сны — ваш идеальный отдых</div>
</header>

<main class="container page">
  <h1>Бронирование номера</h1>

  <p class="room-summary">Стандарт · 2 места · 20 м² · 3 500 ₽/сутки</p>

  <form class="booking-form" method="post" action="booking.html" novalidate>
    <div class="form-field">
      <label for="lastname">Фамилия *</label>
      <input type="text" id="lastname" name="lastname" placeholder="Иванов" required>
    </div>

    <div class="form-field">
      <label for="firstname">Имя *</label>
      <input type="text" id="firstname" name="firstname" placeholder="Иван" required>
    </div>

    <div class="form-field">
      <label for="phone">Телефон *</label>
      <input type="tel" id="phone" name="phone" placeholder="+7(XXX)XXX-XX-XX" required>
    </div>

    <div class="form-field">
      <label for="email">E-mail *</label>
      <input type="email" id="email" name="email" placeholder="ivan@example.ru" required>
    </div>

    <div class="form-field">
      <label for="dateIn">Дата заезда *</label>
      <input type="date" id="dateIn" name="date_in" required>
    </div>

    <div class="form-field">
      <label for="dateOut">Дата выезда *</label>
      <input type="date" id="dateOut" name="date_out" required>
    </div>

    <button type="submit" class="btn btn-primary">Отправить заявку</button>
  </form>

  <p class="success-message" id="success" hidden>Заявка успешно отправлена!</p>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="contacts">
      <p><strong>Контакты</strong></p>
      <p>Адрес: г. Новокузнецк, ул. Садовая, д. 12</p>
      <p>Режим работы: круглосуточно</p>
      <p>Телефон: +7(900)000-00-00</p>
      <p>E-mail: info@sladkiesny.ru</p>
    </div>
  </div>
</footer>

<script src="js/validate.js"></script>
</body>
</html>
